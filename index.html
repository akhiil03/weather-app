<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daylight Weather">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23fff2dc'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23eea844'/%3E%3Cg stroke='%23b97618' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M32 8v7m0 34v7M8 32h7m34 0h7M15 15l5 5m24 24 5 5m0-34-5 5M20 44l-5 5'/%3E%3C/g%3E%3C/svg%3E">
  <title>Weather — Mumbai</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #f4f7fb;
      --surface: rgba(255, 255, 255, .82);
      --surface-solid: #fff;
      --text: #17243b;
      --muted: #77849a;
      --line: #e9eef5;
      --accent: #eea844;
      --accent-dark: #b97618;
      --accent-soft: #fff2dc;
      --sky-glow: rgba(255, 232, 188, .55);
      --shadow: 0 24px 70px rgba(35, 56, 91, .09), 0 3px 10px rgba(35, 56, 91, .04);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 44px 20px 36px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 18% 5%, var(--sky-glow), transparent 34rem),
        var(--page);
      font-size: 15px;
      transition: background .8s ease, color .8s ease;
    }

    body[data-period="night"] {
      color-scheme: dark;
      --page: #101827;
      --surface: rgba(30, 42, 61, .9);
      --surface-solid: #1b2738;
      --text: #eef3fc;
      --muted: #9daec3;
      --line: #34445d;
      --accent: #f3c178;
      --accent-dark: #f7cc87;
      --accent-soft: #3b3040;
      --sky-glow: rgba(86, 100, 174, .24);
      --shadow: 0 24px 70px rgba(0, 0, 0, .3), 0 3px 10px rgba(0, 0, 0, .2);
      background:
        radial-gradient(ellipse at 18% 5%, var(--sky-glow), transparent 34rem),
        var(--page);
    }

    body[data-weather="rain"] {
      --accent: #7896da;
      --accent-dark: #526da9;
      --accent-soft: #e8efff;
    }
    body[data-weather="cloud"] {
      --accent: #8ba2b6;
      --accent-dark: #627a91;
      --accent-soft: #eaf0f5;
    }
    body[data-weather="snow"] {
      --accent: #7bb9cb;
      --accent-dark: #458397;
      --accent-soft: #e3f5f8;
    }
    body[data-weather="storm"] {
      --accent: #9a88d2;
      --accent-dark: #7060a5;
      --accent-soft: #f0ecfc;
    }
    body[data-period="night"][data-weather="rain"] { --accent: #9db5f5; --accent-dark: #b2c5ff; --accent-soft: #26324c; }
    body[data-period="night"][data-weather="cloud"] { --accent: #aec2d2; --accent-dark: #c0d2df; --accent-soft: #293a49; }
    body[data-period="night"][data-weather="snow"] { --accent: #a0d7e4; --accent-dark: #b6e3ec; --accent-soft: #213b45; }
    body[data-period="night"][data-weather="storm"] { --accent: #c0aff5; --accent-dark: #d0c2fa; --accent-soft: #332c4a; }

    button, input { font: inherit; }

    .app {
      width: min(100%, 440px);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 26px;
      animation: rise-in .55s both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.035em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 12px;
      color: var(--accent-dark);
      background: var(--accent-soft);
      font-size: 18px;
    }

    .today-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 550;
      transition: color .8s ease;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 30px;
      margin-left: auto;
      padding: 0 9px;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
      border-radius: 999px;
      color: var(--accent-dark);
      background: var(--surface);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      transition: color .6s ease, background .6s ease, border-color .6s ease, transform .2s ease;
    }
    .theme-toggle:hover { transform: translateY(-1px); }
    .theme-toggle:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, white); outline-offset: 2px; }
    .theme-toggle-icon { font-size: 14px; line-height: 1; }
    .theme-toggle-mode { min-width: 25px; }

    .brand-mark, .search, .search button, .current-card, .details, .day-card {
      transition: background .8s ease, border-color .8s ease, color .8s ease, box-shadow .8s ease;
    }

    .install-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface-solid);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .install-button:hover { border-color: var(--accent); }
    .install-button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, white); outline-offset: 2px; }
    .install-button[hidden] { display: none; }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border: 1px solid rgba(225, 232, 241, .92);
      border-radius: 17px;
      background: var(--surface-solid);
      box-shadow: 0 5px 18px rgba(37, 58, 88, .035);
      animation: rise-in .55s .08s both;
    }

    .search-icon {
      flex: 0 0 auto;
      margin-left: 9px;
      color: #96a1b1;
      font-size: 17px;
    }

    .search input {
      width: 100%;
      min-width: 0;
      height: 39px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 14px;
    }
    .search input::placeholder { color: #a0aaba; }

    .search button {
      flex: 0 0 auto;
      height: 39px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: #263751;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: transform .18s ease, background .18s ease;
    }
    .search button:hover { background: #16253b; transform: translateY(-1px); }
    .search button:focus-visible, .search input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, white); outline-offset: 2px; }

    .message {
      min-height: 20px;
      margin: 9px 3px 2px;
      color: var(--muted);
      font-size: 12px;
      animation: rise-in .45s .12s both;
    }
    .message.error { color: #bb5151; }

    .current-card {
      position: relative;
      overflow: hidden;
      min-height: 238px;
      margin-top: 12px;
      padding: 24px 25px 22px;
      border: 1px solid rgba(255, 255, 255, .76);
      border-radius: 25px;
      background:
        radial-gradient(circle at 92% 12%, rgba(255,255,255,.66) 0 2px, transparent 3px),
        radial-gradient(circle at 78% 24%, rgba(255,255,255,.4) 0 1px, transparent 2px),
        linear-gradient(125deg, color-mix(in srgb, var(--accent-soft) 86%, white), var(--surface-solid) 88%);
      box-shadow: var(--shadow);
      animation: rise-in .7s .12s both;
    }

    .current-card::after {
      position: absolute;
      top: -90px;
      right: -65px;
      width: 250px;
      height: 250px;
      border: 1px solid color-mix(in srgb, var(--accent) 12%, transparent);
      border-radius: 50%;
      box-shadow: 0 0 0 24px color-mix(in srgb, var(--accent) 4%, transparent), 0 0 0 52px color-mix(in srgb, var(--accent) 3%, transparent);
      content: "";
      pointer-events: none;
      animation: halo-breathe 7s ease-in-out infinite;
    }

    .location-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }
    .location-pin { color: var(--accent-dark); }

    .current-main {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
    }

    .temperature {
      margin-left: -5px;
      color: var(--text);
      font-size: clamp(66px, 18vw, 82px);
      font-weight: 650;
      letter-spacing: -.085em;
      line-height: .95;
    }
    .temperature sup {
      position: relative;
      top: -.28em;
      margin-left: 5px;
      color: var(--accent-dark);
      font-size: .39em;
      font-weight: 550;
      letter-spacing: -.04em;
    }

    .weather-visual {
      margin: -6px 9px 0 0;
      color: var(--accent);
      filter: drop-shadow(0 9px 10px color-mix(in srgb, var(--accent) 23%, transparent));
      font-size: 76px;
      line-height: 1;
      transform-origin: center;
      animation: weather-drift 4s ease-in-out infinite;
    }
    body[data-weather="sun"] .weather-visual { animation-name: weather-drift, sun-glow; animation-duration: 4s, 5s; animation-timing-function: ease-in-out, ease-in-out; animation-iteration-count: infinite, infinite; }
    body[data-weather="rain"] .weather-visual { animation-name: weather-drift, rain-shift; animation-duration: 3.3s, 2.4s; animation-timing-function: ease-in-out, ease-in-out; animation-iteration-count: infinite, infinite; }
    body[data-weather="snow"] .weather-visual { animation-name: weather-drift, snow-turn; animation-duration: 4s, 8s; animation-timing-function: ease-in-out, ease-in-out; animation-iteration-count: infinite, infinite; }
    body[data-weather="storm"] .weather-visual { animation-name: weather-drift, storm-flash; animation-duration: 3.5s, 3.8s; animation-timing-function: ease-in-out, ease-in-out; animation-iteration-count: infinite, infinite; }

    .condition-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .condition {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.02em;
    }
    .feels-like { color: var(--muted); font-size: 12px; }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 15px;
      padding: 17px 7px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      animation: rise-in .6s .24s both;
    }

    .detail {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 0;
    }
    .detail + .detail { border-left: 1px solid var(--line); }
    .detail-icon { color: var(--accent-dark); font-size: 17px; }
    .detail-copy { display: grid; gap: 3px; }
    .detail-label { color: var(--muted); font-size: 10px; }
    .detail-value { font-size: 13px; font-weight: 700; white-space: nowrap; }

    .forecast-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 27px 2px 13px;
      animation: rise-in .55s .32s both;
    }
    .forecast-heading h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: -.035em;
    }
    .forecast-heading span { color: var(--muted); font-size: 11px; }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .day-card {
      display: flex;
      min-height: 133px;
      flex-direction: column;
      align-items: center;
      padding: 13px 5px 12px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--surface);
      transition: transform .2s ease, box-shadow .2s ease;
      animation: rise-in .5s both;
    }
    .day-card:nth-child(1) { animation-delay: .12s; }
    .day-card:nth-child(2) { animation-delay: .19s; }
    .day-card:nth-child(3) { animation-delay: .26s; }
    .day-card:nth-child(4) { animation-delay: .33s; }
    .day-card:nth-child(5) { animation-delay: .4s; }
    .day-card:hover { transform: translateY(-3px); box-shadow: 0 9px 18px rgba(37, 58, 88, .07); }
    .day-name { color: var(--muted); font-size: 11px; font-weight: 600; }
    .day-icon { margin: 11px 0 10px; font-size: 24px; line-height: 1; }
    .day-temps { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; }
    .day-low { color: #a0aaba; font-weight: 550; }

    .footer {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 17px;
      color: #99a4b3;
      font-size: 10px;
      animation: rise-in .55s .55s both;
    }
    .footer strong { color: var(--accent-dark); font-weight: 650; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes weather-drift {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes sun-glow {
      0%, 100% { filter: drop-shadow(0 8px 9px color-mix(in srgb, var(--accent) 18%, transparent)); }
      50% { filter: drop-shadow(0 10px 15px color-mix(in srgb, var(--accent) 45%, transparent)); }
    }
    @keyframes rain-shift {
      0%, 100% { rotate: -3deg; }
      50% { rotate: 3deg; }
    }
    @keyframes snow-turn {
      from { rotate: -12deg; }
      to { rotate: 12deg; }
    }
    @keyframes storm-flash {
      0%, 87%, 100% { opacity: 1; }
      89% { opacity: .5; }
      91% { opacity: 1; }
      94% { opacity: .7; }
    }
    @keyframes halo-breathe {
      0%, 100% { opacity: .65; transform: scale(.98); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .loading { opacity: .58; pointer-events: none; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-width: 600px) {
      body {
        padding:
          calc(22px + env(safe-area-inset-top, 0px))
          max(16px, env(safe-area-inset-right, 0px))
          calc(22px + env(safe-area-inset-bottom, 0px))
          max(16px, env(safe-area-inset-left, 0px));
      }
    }

    @media (max-width: 400px) {
      body {
        padding:
          calc(18px + env(safe-area-inset-top, 0px))
          max(13px, env(safe-area-inset-right, 0px))
          calc(18px + env(safe-area-inset-bottom, 0px))
          max(13px, env(safe-area-inset-left, 0px));
      }
      .today-label { display: none; }
      .current-card { padding: 21px 20px; }
      .weather-visual { margin-right: 2px; font-size: 65px; }
      .forecast { gap: 5px; }
      .day-card { padding-inline: 2px; }
      .day-temps { gap: 3px; font-size: 11px; }
      .detail { gap: 5px; }
    }

    body[data-period="night"] .current-card {
      border-color: rgba(255,255,255,.06);
      background: linear-gradient(125deg, color-mix(in srgb, var(--accent-soft) 88%, var(--surface-solid)), var(--surface-solid) 90%);
    }
    body[data-period="night"] .current-card::after {
      border-color: color-mix(in srgb, var(--accent) 16%, transparent);
      box-shadow: 0 0 0 24px color-mix(in srgb, var(--accent) 6%, transparent), 0 0 0 52px color-mix(in srgb, var(--accent) 4%, transparent);
    }
    body[data-period="night"] .search { border-color: var(--line); }
    body[data-period="night"] .search button { color: #17243b; background: #edf3fc; }
    body[data-period="night"] .search button:hover { background: #d8e2f0; }
    body[data-period="night"] .footer { color: #8997aa; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body data-weather="sun" data-period="day">
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">◉</span><span>daylight</span></div>
      <span class="today-label" id="today-label"></span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme mode: auto. Activate to switch day and night themes.">
        <span class="theme-toggle-icon" id="theme-toggle-icon" aria-hidden="true">◉</span>
        <span class="theme-toggle-mode" id="theme-toggle-mode">Auto</span>
      </button>
      <button class="install-button" id="install-button" type="button" aria-label="Install or add this weather app to your home screen"><span aria-hidden="true">↓</span>Install</button>
    </header>

    <form class="search" id="search-form" role="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <label class="sr-only" for="city-search">Search city</label>
      <input id="city-search" type="search" placeholder="Search a city..." autocomplete="off" enterkeyhint="search">
      <button type="submit">Search</button>
    </form>
    <p class="message" id="message" role="status" aria-live="polite"></p>

    <section class="current-card" id="current-card" aria-label="Current weather">
      <div class="location-row"><span class="location-pin" aria-hidden="true">●</span><span id="location">Mumbai, India</span></div>
      <div class="current-main">
        <div class="temperature" id="temperature">--<sup>°</sup></div>
        <div class="weather-visual" id="weather-visual" aria-hidden="true">☀</div>
      </div>
      <div class="condition-row">
        <span class="condition" id="condition">Loading weather...</span>
        <span class="feels-like" id="feels-like"></span>
      </div>
    </section>

    <section class="details" aria-label="Current conditions">
      <div class="detail">
        <span class="detail-icon" aria-hidden="true">⌁</span>
        <div class="detail-copy"><span class="detail-label">Wind</span><span class="detail-value" id="wind">-- km/h</span></div>
      </div>
      <div class="detail">
        <span class="detail-icon" aria-hidden="true">◌</span>
        <div class="detail-copy"><span class="detail-label">Humidity</span><span class="detail-value" id="humidity">--%</span></div>
      </div>
      <div class="detail">
        <span class="detail-icon" aria-hidden="true">☼</span>
        <div class="detail-copy"><span class="detail-label">UV index</span><span class="detail-value" id="uv">--</span></div>
      </div>
    </section>

    <section aria-labelledby="forecast-title">
      <div class="forecast-heading">
        <h2 id="forecast-title">5-day forecast</h2>
        <span id="forecast-range">The week ahead</span>
      </div>
      <div class="forecast" id="forecast" aria-live="polite"></div>
    </section>
    <footer class="footer"><span>Weather data by</span> <strong>Open-Meteo</strong> <span>·</span> <span id="updated">Ready when you are</span></footer>
  </main>

  <script>
    "use strict";

    const DEFAULT_CITY = { name: "Mumbai", country: "India", latitude: 19.0760, longitude: 72.8777, timezone: "Asia/Kolkata" };
    function isDayAtTimezone(timezone) {
      const hour = Number(new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        hourCycle: "h23",
        timeZone: timezone || "UTC"
      }).format(new Date()));
      return hour >= 6 && hour < 18;
    }

    const fallback = {
      current: { temperature_2m: 30, apparent_temperature: 33, relative_humidity_2m: 68, wind_speed_10m: 13, weather_code: 1, is_day: isDayAtTimezone(DEFAULT_CITY.timezone) ? 1 : 0, uv_index: 7 },
      daily: {
        time: Array.from({ length: 5 }, (_, offset) => {
          const date = new Date();
          date.setDate(date.getDate() + offset);
          return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
        }),
        weather_code: [1, 0, 2, 2, 1], temperature_2m_max: [32, 33, 31, 30, 32], temperature_2m_min: [25, 25, 24, 24, 25]
      }
    };

    const $ = (id) => document.getElementById(id);
    let activePlace = DEFAULT_CITY;
    let themeMode = "auto";
    let isDaylight = fallback.current.is_day === 1;
    let pendingInstallPrompt = null;

    function applyTheme(isDay) {
      isDaylight = isDay;
      const isNight = themeMode === "night" || (themeMode === "auto" && !isDaylight);
      const period = isNight ? "night" : "day";
      const icon = isNight ? "☾" : "☀";
      document.body.dataset.period = period;
      $("theme-toggle-icon").textContent = icon;
      $("theme-toggle-mode").textContent = themeMode === "auto" ? "Auto" : themeMode === "day" ? "Day" : "Night";
      $("theme-toggle").setAttribute("aria-label", `Theme mode: ${themeMode}. Activate to switch day and night themes.`);
      $("theme-toggle").title = `Theme: ${themeMode}. Tap to change.`;
      document.querySelector('meta[name="theme-color"]').content = isNight ? "#101827" : "#f4f7fb";
    }

    $("theme-toggle").addEventListener("click", () => {
      themeMode = themeMode === "auto" ? "day" : themeMode === "day" ? "night" : "auto";
      applyTheme(isDaylight);
    });

    async function refreshDaylight() {
      if (themeMode !== "auto" || document.visibilityState === "hidden") return;
      const place = activePlace;
      const params = new URLSearchParams({
        latitude: place.latitude,
        longitude: place.longitude,
        current: "is_day",
        timezone: place.timezone || "auto"
      });
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error(`Weather service returned ${response.status}.`);
        const data = await response.json();
        if (data.current?.is_day !== 0 && data.current?.is_day !== 1) throw new Error("Weather service returned an invalid day/night status.");
        if (place !== activePlace || themeMode !== "auto") return;
        applyTheme(data.current.is_day === 1);
      } catch (error) {
        console.warn("Could not refresh the day/night theme:", error);
      }
    }

    window.setInterval(refreshDaylight, 15 * 60 * 1000);
    document.addEventListener("visibilitychange", refreshDaylight);

    function showInstallMessage(text) {
      $("message").className = "message";
      $("message").textContent = text;
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      pendingInstallPrompt = event;
    });

    window.addEventListener("appinstalled", () => {
      pendingInstallPrompt = null;
      $("install-button").hidden = true;
      showInstallMessage("Daylight Weather was added to your home screen.");
    });

    $("install-button").addEventListener("click", async () => {
      if (pendingInstallPrompt) {
        const prompt = pendingInstallPrompt;
        pendingInstallPrompt = null;
        try {
          await prompt.prompt();
          const choice = await prompt.userChoice;
          showInstallMessage(choice.outcome === "accepted" ? "Daylight Weather was added to your home screen." : "Installation was cancelled.");
        } catch (error) {
          console.warn("Could not open the install prompt:", error);
          showInstallMessage("Use your browser menu to install or add this app to your home screen.");
        }
        return;
      }

      const isAppleMobile = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      showInstallMessage(isAppleMobile
        ? "To install: tap Share, then choose “Add to Home Screen”."
        : "Open your browser menu and choose “Install app” or “Add to Home screen”.");
    });

    if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) {
      $("install-button").hidden = true;
    }

    const weatherInfo = (code, isDay = true) => {
      if (code === 0) return { label: "Clear sky", icon: isDay ? "☀" : "☾", theme: "sun" };
      if (code === 1) return { label: "Mostly clear", icon: isDay ? "🌤" : "☾", theme: "sun" };
      if (code === 2) return { label: "Partly cloudy", icon: "⛅", theme: "cloud" };
      if (code === 3) return { label: "Overcast", icon: "☁", theme: "cloud" };
      if ([45, 48].includes(code)) return { label: "Foggy", icon: "≋", theme: "cloud" };
      if ([51, 53, 55, 56, 57].includes(code)) return { label: "Drizzle", icon: "🌦", theme: "rain" };
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { label: "Rain showers", icon: "🌧", theme: "rain" };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { label: "Snow", icon: "❄", theme: "snow" };
      if ([95, 96, 99].includes(code)) return { label: "Thunderstorms", icon: "⛈", theme: "storm" };
      return { label: "Cloudy", icon: "☁", theme: "cloud" };
    };

    const dayName = (dateString, index) => {
      if (index === 0) return "Today";
      return new Intl.DateTimeFormat(undefined, { weekday: "short", timeZone: "UTC" }).format(new Date(dateString + "T12:00:00Z"));
    };

    function render(data, place, isFallback) {
      const current = data.current;
      const info = weatherInfo(current.weather_code, current.is_day !== 0);
      document.body.dataset.weather = info.theme;
      applyTheme(current.is_day === 1);
      $("location").textContent = [place.name, place.country].filter(Boolean).join(", ");
      $("temperature").innerHTML = `${Math.round(current.temperature_2m)}<sup>°</sup>`;
      $("condition").textContent = info.label;
      $("weather-visual").textContent = info.icon;
      $("feels-like").textContent = `Feels like ${Math.round(current.apparent_temperature)}°`;
      $("wind").textContent = `${Math.round(current.wind_speed_10m)} km/h`;
      $("humidity").textContent = `${Math.round(current.relative_humidity_2m)}%`;
      $("uv").textContent = Number(current.uv_index).toFixed(0);
      $("forecast").innerHTML = data.daily.time.slice(0, 5).map((date, index) => {
        const dayWeather = weatherInfo(data.daily.weather_code[index]);
        return `<article class="day-card">
          <span class="day-name">${dayName(date, index)}</span>
          <span class="day-icon" aria-label="${dayWeather.label}">${dayWeather.icon}</span>
          <span class="day-temps"><span>${Math.round(data.daily.temperature_2m_max[index])}°</span><span class="day-low">${Math.round(data.daily.temperature_2m_min[index])}°</span></span>
        </article>`;
      }).join("");
      $("forecast-range").textContent = isFallback ? "Typical conditions" : "High / low";
      $("updated").textContent = isFallback ? "Offline forecast" : `Updated ${new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(new Date())}`;
      document.title = `Weather — ${place.name}`;
    }

    async function fetchWeather(place) {
      const params = new URLSearchParams({
        latitude: place.latitude,
        longitude: place.longitude,
        current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,uv_index",
        daily: "weather_code,temperature_2m_max,temperature_2m_min",
        timezone: place.timezone || "auto",
        forecast_days: "5"
      });
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      if (!response.ok) throw new Error(`Weather service returned ${response.status}.`);
      const data = await response.json();
      if (!data.current || !data.daily || data.daily.time?.length < 5) throw new Error("Weather service returned incomplete data.");
      if (!Number.isFinite(data.current.uv_index)) data.current.uv_index = 0;
      return data;
    }

    async function lookupCity(query) {
      const params = new URLSearchParams({ name: query, count: "1", language: "en", format: "json" });
      const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?${params}`);
      if (!response.ok) throw new Error("City search is temporarily unavailable.");
      const data = await response.json();
      if (!data.results?.length) throw new Error(`No city found for “${query}”. Try another spelling.`);
      return data.results[0];
    }

    async function load(place, isInitial = false) {
      const card = $("current-card");
      activePlace = place;
      card.classList.add("loading");
      $("message").className = "message";
      $("message").textContent = isInitial ? "Finding today's weather..." : "Finding your forecast...";
      try {
        const data = await fetchWeather(place);
        render(data, place, false);
        $("message").textContent = "";
      } catch (error) {
        const offlineData = {
          current: { ...fallback.current, is_day: isDayAtTimezone(place.timezone) ? 1 : 0 },
          daily: fallback.daily
        };
        render(offlineData, place, true);
        $("message").textContent = `Live weather unavailable — showing a sample forecast.`;
        $("message").className = "message";
        console.warn("Could not load live weather:", error);
      } finally {
        card.classList.remove("loading");
      }
    }

    $("search-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = $("city-search").value.trim();
      if (!query) {
        $("message").className = "message error";
        $("message").textContent = "Enter a city name to search.";
        $("city-search").focus();
        return;
      }
      const button = $("search-form").querySelector("button");
      button.disabled = true;
      $("current-card").classList.add("loading");
      $("message").className = "message";
      $("message").textContent = `Searching for ${query}...`;
      try {
        const city = await lookupCity(query);
        await load({
          name: city.name,
          country: city.country,
          latitude: city.latitude,
          longitude: city.longitude,
          timezone: city.timezone
        });
        $("city-search").value = "";
      } catch (error) {
        $("message").className = "message error";
        $("message").textContent = error.message || "Unable to search for that city.";
        $("current-card").classList.remove("loading");
      } finally {
        button.disabled = false;
      }
    });

    $("today-label").textContent = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" }).format(new Date());
    render(fallback, DEFAULT_CITY, true);
    load(DEFAULT_CITY, true);

    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("./sw.js").catch((error) => {
        console.warn("Could not register the offline app service worker:", error);
      });
    }
  </script>
</body>
</html>
